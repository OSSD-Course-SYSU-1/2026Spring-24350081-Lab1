ohpm --version 2>&1; if ($LASTEXITCODE -ne 0) { Write-Output \"ohpm not on PATH, checking...\" }; Get-ChildItem -Path \"D:\\DevEco Studio\\tools\\ohpm\\bin\" -ErrorAction SilentlyContinue | Select-Object Name)", "Bash($jdkDir = Get-ChildItem -Path \"D:\\DevEco Studio\\tools\" -Directory -Filter \"*jdk*\" -ErrorAction SilentlyContinue | Select-Object -First 1; if ($jdkDir) { Write-Output \"JDK found: $($jdkDir.FullName)\" } else { Write-Output \"No JDK dir found\" }; Get-ChildItem -Path \"D:\\DevEco Studio\\tools\" -Directory -ErrorAction SilentlyContinue | Select-Object Name)", "Bash(java -version 2>&1; if ($LASTEXITCODE -ne 0) { Write-Output \"Java not on PATH\" }; Get-ChildItem -Path \"C:\\Program Files\" -Directory -Filter \"*jdk*\" -ErrorAction SilentlyContinue | Select-Object Name; Get-ChildItem -Path \"C:\\Program Files\" -Directory -Filter \"*Java*\" -ErrorAction SilentlyContinue | Select-Object Name; Get-ChildItem -Path \"D:\\\" -Directory -Filter \"*jdk*\" -ErrorAction SilentlyContinue | Select-Object Name)", "Bash(Test-Path \"D:\\DevEco Studio\\tools\\hvigor\\bin\\hvigorw.bat\"; java -version 2>&1 | Select-Object -First 1; Write-Output \"---\"; node --version)", "Bash(& \"D:\\DevEco Studio\\tools\\node\\node.exe\" \"D:\\DevEco Studio\\tools\\hvigor\\bin\\hvigorw.js\" --mode module -p module=entry@default -p product=default -p requiredDeviceType=phone assembleHap --analyze=normal --parallel --incremental --daemon 2>&1)", "Bash($env:JAVA_HOME = \"D:\\DevEco Studio\\jbr\"; $env:PATH = \"$env:JAVA_HOME\\bin;$env:PATH\"; & \"D:\\DevEco Studio\\tools\\hvigor\\bin\\hvigorw.bat\" --mode module -p product=default -p module=entry@default assembleHap 2>&1)", "Bash(pip install python-pptx 2>$null; python -c \"\nfrom pptx import Presentation\nimport sys\n\nprs = Presentation(r'D:\\AAAMy_Project\\DevEcoProject\\Assignment-Echo\\02.自由流转.pptx')\nfor i, slide in enumerate(prs.slides, 1):\n    print(f'=== 幻灯片 {i} ===')\n    for shape in slide.shapes:\n        if shape.has_t